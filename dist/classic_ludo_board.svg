<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="600" height="600" fill="#f8fafc" rx="16"/>

  <!-- ==================== CORNER BASES (6x6 each = 240x240) ==================== -->
  
  <!-- Green Base (Top-Left: x=0..240, y=0..240) -->
  <rect x="0" y="0" width="240" height="240" fill="#059669" rx="16"/>
  <rect x="20" y="20" width="200" height="200" fill="#ffffff" rx="16" filter="url(#shadow)"/>
  <!-- 4 green circles centered at exact cell centers: (60,60), (180,60), (60,180), (180,180) -->
  <circle cx="60" cy="60" r="22" fill="#059669" stroke="#047857" stroke-width="2.5"/>
  <circle cx="180" cy="60" r="22" fill="#059669" stroke="#047857" stroke-width="2.5"/>
  <circle cx="60" cy="180" r="22" fill="#059669" stroke="#047857" stroke-width="2.5"/>
  <circle cx="180" cy="180" r="22" fill="#059669" stroke="#047857" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="12" fill="#ffffff" opacity="0.3"/>
  <circle cx="180" cy="60" r="12" fill="#ffffff" opacity="0.3"/>
  <circle cx="60" cy="180" r="12" fill="#ffffff" opacity="0.3"/>
  <circle cx="180" cy="180" r="12" fill="#ffffff" opacity="0.3"/>

  <!-- Yellow Base (Top-Right: x=360..600, y=0..240) -->
  <rect x="360" y="0" width="240" height="240" fill="#d97706" rx="16"/>
  <rect x="380" y="20" width="200" height="200" fill="#ffffff" rx="16" filter="url(#shadow)"/>
  <!-- 4 yellow circles centered at exact cell centers: (420,60), (540,60), (420,180), (540,180) -->
  <circle cx="420" cy="60" r="22" fill="#d97706" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="540" cy="60" r="22" fill="#d97706" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="420" cy="180" r="22" fill="#d97706" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="540" cy="180" r="22" fill="#d97706" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="420" cy="60" r="12" fill="#ffffff" opacity="0.3"/>
  <circle cx="540" cy="60" r="12" fill="#ffffff" opacity="0.3"/>
  <circle cx="420" cy="180" r="12" fill="#ffffff" opacity="0.3"/>
  <circle cx="540" cy="180" r="12" fill="#ffffff" opacity="0.3"/>

  <!-- Red Base (Bottom-Left: x=0..240, y=360..600) -->
  <rect x="0" y="360" width="240" height="240" fill="#e11d48" rx="16"/>
  <rect x="20" y="380" width="200" height="200" fill="#ffffff" rx="16" filter="url(#shadow)"/>
  <!-- 4 red circles centered at exact cell centers: (60,420), (180,420), (60,540), (180,540) -->
  <circle cx="60" cy="420" r="22" fill="#e11d48" stroke="#be123c" stroke-width="2.5"/>
  <circle cx="180" cy="420" r="22" fill="#e11d48" stroke="#be123c" stroke-width="2.5"/>
  <circle cx="60" cy="540" r="22" fill="#e11d48" stroke="#be123c" stroke-width="2.5"/>
  <circle cx="180" cy="540" r="22" fill="#e11d48" stroke="#be123c" stroke-width="2.5"/>
  <circle cx="60" cy="420" r="12" fill="#ffffff" opacity="0.3"/>
  <circle cx="180" cy="420" r="12" fill="#ffffff" opacity="0.3"/>
  <circle cx="60" cy="540" r="12" fill="#ffffff" opacity="0.3"/>
  <circle cx="180" cy="540" r="12" fill="#ffffff" opacity="0.3"/>

  <!-- Blue Base (Bottom-Right: x=360..600, y=360..600) -->
  <rect x="360" y="360" width="240" height="240" fill="#2563eb" rx="16"/>
  <rect x="380" y="380" width="200" height="200" fill="#ffffff" rx="16" filter="url(#shadow)"/>
  <!-- 4 blue circles centered at exact cell centers: (420,420), (540,420), (420,540), (540,540) -->
  <circle cx="420" cy="420" r="22" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
  <circle cx="540" cy="420" r="22" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
  <circle cx="420" cy="540" r="22" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
  <circle cx="540" cy="540" r="22" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
  <circle cx="420" cy="420" r="12" fill="#ffffff" opacity="0.3"/>
  <circle cx="540" cy="420" r="12" fill="#ffffff" opacity="0.3"/>
  <circle cx="420" cy="540" r="12" fill="#ffffff" opacity="0.3"/>
  <circle cx="540" cy="540" r="12" fill="#ffffff" opacity="0.3"/>

  <!-- ==================== COLORED PATHS & START CELLS ==================== -->
  <!-- Green Track (col 1, row 6 start; row 7 cols 1-5 home path) -->
  <rect x="40" y="240" width="40" height="40" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
  <rect x="40" y="280" width="200" height="40" fill="#10b981" stroke="#047857" stroke-width="1.5"/>

  <!-- Yellow Track (col 8, row 1 start; col 7 rows 1-5 home path) -->
  <rect x="320" y="40" width="40" height="40" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <rect x="280" y="40" width="40" height="200" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>

  <!-- Blue Track (col 13, row 8 start; row 7 cols 9-13 home path) -->
  <rect x="520" y="320" width="40" height="40" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="360" y="280" width="200" height="40" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- Red Track (col 6, row 13 start; col 7 rows 9-13 home path) -->
  <rect x="240" y="520" width="40" height="40" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/>
  <rect x="280" y="360" width="40" height="200" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/>

  <!-- ==================== CENTER HOME FINISH TRIANGLES ==================== -->
  <polygon points="240,240 300,300 240,360" fill="#059669"/>
  <polygon points="240,240 300,300 360,240" fill="#d97706"/>
  <polygon points="360,240 300,300 360,360" fill="#2563eb"/>
  <polygon points="240,360 300,300 360,360" fill="#e11d48"/>

  <!-- ==================== TRACK GRID LINES (40px intervals) ==================== -->
  <!-- Top arm (x=240..360, y=0..240) -->
  <line x1="280" y1="0" x2="280" y2="240" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="320" y1="0" x2="320" y2="240" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="240" y1="40" x2="360" y2="40" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="240" y1="80" x2="360" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="240" y1="120" x2="360" y2="120" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="240" y1="160" x2="360" y2="160" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="240" y1="200" x2="360" y2="200" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Bottom arm (x=240..360, y=360..600) -->
  <line x1="280" y1="360" x2="280" y2="600" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="320" y1="360" x2="320" y2="600" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="240" y1="400" x2="360" y2="400" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="240" y1="440" x2="360" y2="440" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="240" y1="480" x2="360" y2="480" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="240" y1="520" x2="360" y2="520" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="240" y1="560" x2="360" y2="560" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Left arm (x=0..240, y=240..360) -->
  <line x1="0" y1="280" x2="240" y2="280" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="0" y1="320" x2="240" y2="320" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="40" y1="240" x2="40" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="80" y1="240" x2="80" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="120" y1="240" x2="120" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="160" y1="240" x2="160" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="200" y1="240" x2="200" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Right arm (x=360..600, y=240..360) -->
  <line x1="360" y1="280" x2="600" y2="280" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="360" y1="320" x2="600" y2="320" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="400" y1="240" x2="400" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="440" y1="240" x2="440" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="480" y1="240" x2="480" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="520" y1="240" x2="520" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="560" y1="240" x2="560" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Center square outer border -->
  <rect x="240" y="240" width="120" height="120" fill="none" stroke="#475569" stroke-width="2"/>
  
  <!-- Outer board border -->
  <rect x="1" y="1" width="598" height="598" fill="none" stroke="#334155" stroke-width="2" rx="16"/>
</svg>
